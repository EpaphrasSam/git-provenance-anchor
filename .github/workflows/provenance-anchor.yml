name: provenance-anchor

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to anchor
        required: true

permissions:
  contents: read

jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target tag
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tagged state
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compute tree hash
        id: tree
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          TREE=$(git rev-parse "${TAG}^{tree}")
          echo "tree=${TREE}" >> "$GITHUB_OUTPUT"
          echo "Tree hash for ${TAG}: ${TREE}"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.51.0

      - name: Generate CycloneDX SBOM
        id: sbom
        run: |
          syft dir:. -o cyclonedx-json=sbom.cdx.json
          SBOM_HASH=$(sha256sum sbom.cdx.json | awk '{print $1}')
          echo "hash=${SBOM_HASH}" >> "$GITHUB_OUTPUT"
          echo "SBOM sha256: ${SBOM_HASH}"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.target.outputs.tag }}
          path: sbom.cdx.json

      - name: Install published gpa
        run: npm install -g git-provenance-anchor@1.0.0

      - name: Submit anchors
        env:
          ANCHOR_DEPLOYER_KEY: ${{ secrets.ANCHOR_DEPLOYER_KEY }}
          GPA_NETWORKS: ${{ vars.GPA_NETWORKS }}
        run: |
          gpa anchor \
            --tag "${{ steps.target.outputs.tag }}" \
            --tree-hash "${{ steps.tree.outputs.tree }}" \
            --sbom-hash "${{ steps.sbom.outputs.hash }}"

      - name: Verify the anchor we just wrote
        env:
          GPA_NETWORKS: ${{ vars.GPA_NETWORKS }}
        run: |
          gpa verify \
            --ref "${{ steps.target.outputs.tag }}" \
            --tag "${{ steps.target.outputs.tag }}" \
            --sbom sbom.cdx.json
