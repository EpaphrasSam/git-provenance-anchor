name: latency-settle

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

concurrency:
  group: gpa-latency-settle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Fill pending L1 fields
        run: npx ts-node --transpile-only scripts/latency-collect.ts --mode settle

      - name: Commit ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/data/latency-series.json
          if git diff --cached --quiet; then
            echo "No settlement updates"
            exit 0
          fi
          git commit -m "chore: settle latency observations $(date -u +%Y%m%dT%H%M%SZ)"
          git push
