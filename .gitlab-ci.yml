# Live GitLab CI for this repository. Adopting projects copy
# workflows/provenance-anchor.gitlab-ci.yml rather than this file.
#
# Requires CI/CD variables:
#   ANCHOR_DEPLOYER_KEY  — dedicated allowlisted key (masked)
#   GPA_NETWORKS         — space-separated deployments (opSepolia for this twin)

workflow:
  rules:
    - if: $CI_COMMIT_TAG

stages:
  - anchor

variables:
  GIT_DEPTH: "0"

provenance-anchor:
  stage: anchor
  image: node:20-bookworm
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apt-get update && apt-get install -y curl ca-certificates git
    - |
      for i in 1 2 3 4 5; do
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.51.0 && break
        echo "syft install attempt ${i} failed"
        sleep 8
      done
      command -v syft
  script:
    - |
      TAG="$CI_COMMIT_TAG"
      TREE=$(git rev-parse "HEAD^{tree}")
      echo "Tree hash for ${TAG}: ${TREE}"
      syft dir:. -o cyclonedx-json=sbom.cdx.json
      SBOM_HASH=$(sha256sum sbom.cdx.json | awk '{print $1}')
      npm install -g git-provenance-anchor@0.1.1
      gpa anchor --tag "$TAG" --tree-hash "$TREE" --sbom-hash "$SBOM_HASH"
      gpa verify --ref "$TAG" --tag "$TAG"
  artifacts:
    paths:
      - sbom.cdx.json
