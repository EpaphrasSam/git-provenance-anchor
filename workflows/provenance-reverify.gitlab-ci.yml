# GitLab CI twin of workflows/provenance-reverify.yml.
# Read-only; no ANCHOR_DEPLOYER_KEY. Optional: GPA_NETWORKS.
# Prefer a daily schedule so a one-day revert window sits inside the check interval.

stages:
  - reverify

provenance-reverify:
  stage: reverify
  image: node:20-bookworm
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - apt-get update && apt-get install -y git
  script:
    - npm install -g git-provenance-anchor@0.1.1
    - gpa reverify
