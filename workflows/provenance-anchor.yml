# GitHub Actions template — copy into an adopting repository as
# `.github/workflows/provenance-anchor.yml`.
#
# Triggered only by tag pushes. Never runs the project's own build scripts.
#
# Requires a repository secret:
#   ANCHOR_DEPLOYER_KEY  — a dedicated key allowlisted for the project's on-chain id
# Optional repository variable:
#   GPA_NETWORKS         — space-separated deployment names (default: every deployments/ record)
#
# Assumes the repository has a `.provenance-manifest.json` and a `deployments/` directory,
# both produced by `gpa init` and the deploy script.

name: provenance-anchor

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute tree hash
        id: tree
        run: |
          TAG="${GITHUB_REF_NAME}"
          TREE=$(git rev-parse "${TAG}^{tree}")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tree=${TREE}" >> "$GITHUB_OUTPUT"
          echo "Tree hash for ${TAG}: ${TREE}"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate CycloneDX SBOM
        id: sbom
        run: |
          syft dir:. -o cyclonedx-json=sbom.cdx.json
          SBOM_HASH=$(sha256sum sbom.cdx.json | awk '{print $1}')
          echo "hash=${SBOM_HASH}" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.tree.outputs.tag }}
          path: sbom.cdx.json

      - name: Submit anchors
        env:
          ANCHOR_DEPLOYER_KEY: ${{ secrets.ANCHOR_DEPLOYER_KEY }}
          GPA_NETWORKS: ${{ vars.GPA_NETWORKS }}
        run: |
          npx ts-node --transpile-only scripts/submit-anchor.ts \
            --tag "${{ steps.tree.outputs.tag }}" \
            --tree-hash "${{ steps.tree.outputs.tree }}" \
            --sbom-hash "${{ steps.sbom.outputs.hash }}"
