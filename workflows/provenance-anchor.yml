# GitHub Actions template — copy into an adopting repository as
# `.github/workflows/provenance-anchor.yml`.
#
# Triggered only by tag pushes. Never runs the project's own build scripts.
# Requires repository secrets:
#   ANCHOR_DEPLOYER_KEY  — allowlisted key for the project's on-chain id
# Optional vars:
#   GPA_NETWORKS         — space-separated deployment names (default: opSepolia arbitrumSepolia)

name: provenance-anchor

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Compute tree hash
        id: tree
        run: |
          TAG="${GITHUB_REF_NAME}"
          TREE=$(git rev-parse "${TAG}^{tree}")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tree=${TREE}" >> "$GITHUB_OUTPUT"
          echo "Tree hash for ${TAG}: ${TREE}"

      - name: Generate CycloneDX SBOM
        run: |
          syft dir:. -o cyclonedx-json=sbom.cdx.json
          SBOM_HASH=$(sha256sum sbom.cdx.json | awk '{print $1}')
          echo "SBOM_HASH=${SBOM_HASH}" >> "$GITHUB_ENV"

      - name: Submit anchors
        env:
          ANCHOR_DEPLOYER_KEY: ${{ secrets.ANCHOR_DEPLOYER_KEY }}
          GPA_NETWORKS: ${{ vars.GPA_NETWORKS }}
        run: |
          npm install --no-save ethers dotenv ts-node typescript
          npx ts-node scripts/submit-anchor.ts \
            --tag "${{ steps.tree.outputs.tag }}" \
            --tree-hash "${{ steps.tree.outputs.tree }}" \
            --sbom-hash "${SBOM_HASH}"
