# GitLab CI twin of workflows/provenance-anchor.yml.
# Copy into an adopting repository and adjust the image/cache to local conventions.
# Requires CI variable ANCHOR_DEPLOYER_KEY (masked, protected).
# Optional: GPA_NETWORKS.

workflow:
  rules:
    - if: $CI_COMMIT_TAG

stages:
  - anchor

provenance-anchor:
  stage: anchor
  image: node:20-bookworm
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apt-get update && apt-get install -y curl ca-certificates git
    - |
      for i in 1 2 3 4 5; do
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.51.0 && break
        echo "syft install attempt ${i} failed"
        sleep 8
      done
      command -v syft
  script:
    - |
      TAG="$CI_COMMIT_TAG"
      TREE=$(git rev-parse "${TAG}^{tree}")
      echo "Tree hash for ${TAG}: ${TREE}"
      syft dir:. -o cyclonedx-json=sbom.cdx.json
      SBOM_HASH=$(sha256sum sbom.cdx.json | awk '{print $1}')
      npx --yes --package git-provenance-anchor@0.1.1 -- gpa anchor --tag "$TAG" --tree-hash "$TREE" --sbom-hash "$SBOM_HASH"
  artifacts:
    paths:
      - sbom.cdx.json
